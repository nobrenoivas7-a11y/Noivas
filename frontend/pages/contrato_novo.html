{% extends "base.html" %}
{% block title %}Novo Contrato — Nobre Elegancy{% endblock %}
{% block topbar_title %}Novo Contrato{% endblock %}

{% block content %}
<div class="card" style="max-width:800px">
  <div class="card-header"><h6><i class="bi bi-plus-circle me-2"></i>Novo Contrato</h6></div>
  <div class="card-body">
    <form method="POST" id="form-contrato">
      <div class="row g-3">

        <!-- DADOS DA NOIVA -->
        <div class="col-12">
          <div class="card" style="background:var(--card2);border:1px solid var(--border)">
            <div class="card-body">
              <p class="mb-3 fw-bold" style="color:var(--rose-dark);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em">
                <i class="bi bi-person me-2"></i>Dados da Noiva
              </p>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Nome Completo *</label>
                  <input type="text" name="nome_cliente" class="form-control" required placeholder="Nome da noiva">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Telefone / WhatsApp *</label>
                  <input type="text" name="telefone" class="form-control" required placeholder="(85) 99999-9999">
                </div>
                <div class="col-md-6">
                  <label class="form-label">CPF</label>
                  <input type="text" name="cpf" class="form-control" placeholder="000.000.000-00">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Endereço</label>
                  <input type="text" name="endereco" class="form-control" placeholder="Rua, número, bairro, cidade">
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- TOGGLE PRIMEIRO ALUGUEL -->
        <div class="col-12">
          <div class="form-check form-switch p-3" style="background:var(--card2);border:1px solid var(--border);border-radius:8px">
            <input class="form-check-input" type="checkbox" role="switch" id="primeiroAluguel" name="primeiro_aluguel" onchange="toggleModo()">
            <label class="form-check-label fw-bold" for="primeiroAluguel" style="color:var(--rose-dark)">
              <i class="bi bi-stars me-1"></i>Primeiro Aluguel (vestido sob medida — cadastrar croqui)
            </label>
          </div>
        </div>

        <!-- DATAS -->
        <div class="col-md-4">
          <label class="form-label">Data de Retirada *</label>
          <input type="date" name="data_retirada" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Data de Devolução *</label>
          <input type="date" name="data_devolucao" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Data da Prova</label>
          <input type="date" name="data_prova" class="form-control">
        </div>

        <!-- PEÇAS DO ESTOQUE (modo normal) -->
        <div class="col-12" id="bloco-estoque">
          <label class="form-label">Vestidos *</label>
          <div id="pecas-selecionadas" class="mb-2 d-flex flex-wrap gap-2"></div>
          <select id="select-peca" class="form-select" onchange="adicionarPeca(this)">
            <option value="">Selecione um vestido para adicionar...</option>
            {% for p in pecas %}
            <option value="{{ p.id }}" data-label="{{ p.codigo }} — {{ p.modelo }} — Tam {{ p.tamanho }}">
              {{ p.codigo }} — {{ p.modelo }} — Tam {{ p.tamanho }}
            </option>
            {% endfor %}
          </select>
          <div id="pecas-inputs"></div>
          <div class="form-text" style="color:var(--text-dim);font-size:.72rem">Você pode adicionar mais de um vestido.</div>
        </div>

        <!-- CROQUI (modo primeiro aluguel) -->
        <div class="col-12" id="bloco-croqui" style="display:none">
          <label class="form-label">Foto do Croqui</label>
          <input type="file" id="input-foto-croqui" accept="image/*" class="form-control mb-2">
          <div id="preview-croqui" class="mb-2"></div>
          <input type="hidden" name="foto_croqui" id="foto_croqui_url">
          <div id="upload-status" style="font-size:.78rem;color:var(--text-dim)"></div>
        </div>

        <!-- FINANCEIRO -->
        <div class="col-md-4">
          <label class="form-label">Valor Total (R$) *</label>
          <input type="number" name="valor_total" class="form-control" step="0.01" min="0" required placeholder="0.00">
        </div>
        <div class="col-md-4">
          <label class="form-label">Valor Pago (R$)</label>
          <input type="number" name="valor_pago" class="form-control" step="0.01" min="0" placeholder="0.00" value="0">
        </div>
        <div class="col-md-4">
          <label class="form-label">Forma de Pagamento</label>
          <select name="forma_pagamento" class="form-select">
            <option value="">Selecione...</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="PIX">PIX</option>
            <option value="Cartão Débito">Cartão Débito</option>
            <option value="Cartão Crédito">Cartão Crédito</option>
            <option value="Transferência">Transferência</option>
          </select>
        </div>

        <!-- OBSERVAÇÕES -->
        <div class="col-12">
          <label class="form-label">Observações</label>
          <textarea name="observacoes" class="form-control" rows="3"
            placeholder="Modelo escolhido, detalhes do vestido, acessórios, ajustes necessários..."></textarea>
        </div>

        <div class="col-12 d-flex gap-2">
          <button class="btn btn-rose px-4">Salvar Contrato</button>
          <a href="{{ url_for('contratos.lista') }}" class="btn btn-rose-outline px-4">Cancelar</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const IMGBB_KEY = '5f48d7abf754e28597571e6671806d19';
const pecasSelecionadas = new Set();

function toggleModo() {
  const isPrimeiro = document.getElementById('primeiroAluguel').checked;
  document.getElementById('bloco-estoque').style.display = isPrimeiro ? 'none' : 'block';
  document.getElementById('bloco-croqui').style.display = isPrimeiro ? 'block' : 'none';
}

function adicionarPeca(sel) {
  const id = sel.value;
  const label = sel.options[sel.selectedIndex].dataset.label;
  if (!id || pecasSelecionadas.has(id)) {
    sel.value = '';
    return;
  }
  pecasSelecionadas.add(id);

  const badge = document.createElement('span');
  badge.className = 'badge d-flex align-items-center gap-1';
  badge.style.cssText = 'background:var(--rose-glow);color:var(--rose-dark);border:1px solid var(--border);font-size:.78rem;padding:.4rem .7rem';
  badge.innerHTML = label + ' <button type="button" onclick="removerPeca(\'' + id + '\', this.parentElement)" style="background:none;border:none;color:var(--rose-dark);font-size:1rem;line-height:1;cursor:pointer">×</button>';
  document.getElementById('pecas-selecionadas').appendChild(badge);

  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = 'peca_ids';
  input.value = id;
  input.id = 'peca-input-' + id;
  document.getElementById('pecas-inputs').appendChild(input);

  sel.value = '';
}

function removerPeca(id, badge) {
  pecasSelecionadas.delete(id);
  badge.remove();
  const input = document.getElementById('peca-input-' + id);
  if (input) input.remove();
}

document.getElementById('input-foto-croqui').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const status = document.getElementById('upload-status');
  status.textContent = 'Enviando foto...';

  const formData = new FormData();
  formData.append('image', file);

  try {
    const res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_KEY, {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('foto_croqui_url').value = data.data.url;
      document.getElementById('preview-croqui').innerHTML =
        '<img src="' + data.data.url + '" style="max-width:200px;border-radius:8px;border:1px solid var(--border)">';
      status.textContent = 'Foto enviada com sucesso!';
      status.style.color = 'var(--green)';
    } else {
      status.textContent = 'Erro ao enviar foto.';
      status.style.color = 'var(--red)';
    }
  } catch (err) {
    status.textContent = 'Erro ao enviar foto.';
    status.style.color = 'var(--red)';
  }
});
</script>
{% endblock %}
